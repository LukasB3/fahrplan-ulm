version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # The types follow the Node version that runs (22), not the newest one.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      web:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      api:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request for all actions: separate ones touch neighbouring lines and conflict.
    groups:
      actions:
        patterns: ['*']
